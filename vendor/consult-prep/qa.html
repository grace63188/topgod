.tk dd.mono{white-space:nowrap;font-size:14px}
.dl-tx .dt{color:var(--text-1)}
.boot{display:flex;justify-content:center;padding:40px 0;color:var(--text-3);font-size:14px}
.fail{margin:40px auto;max-width:420px;text-align:center;color:var(--text-2);font-size:15px;line-height:1.8}
.sk{display:inline-block;border-radius:6px;background:var(--ink-3);min-width:6em;height:1em;vertical-align:middle}
.wrap{max-width:var(--container);margin:0 auto}
.side{display:none}
@media (min-width:1024px){
  .wrap{max-width:1080px;display:grid;grid-template-columns:minmax(0,720px) 300px;gap:36px;justify-content:center;padding:0 var(--gutter)}
  .wrap .page{padding-left:0;padding-right:0;max-width:none;margin:0}
  .side{display:block;position:sticky;top:84px;align-self:start;margin-top:24px}
  .side .card{padding:18px}
  .side h3{font-size:16px;margin:0 0 4px}
  .side .en{font-family:var(--font-mono);font-size:10px;letter-spacing:.26em;color:var(--gold)}
  .side .pg{display:grid;gap:12px;margin-top:14px}
  .side .pg .row1{display:flex;justify-content:space-between;font-size:14px;color:var(--text-2)}
  .side .kv2{display:grid;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-1)}
  .side .kv2 div{display:flex;justify-content:space-between;gap:10px;font-size:13px}
  .side .kv2 dt{color:var(--text-3)} .side .kv2 dd{margin:0;color:var(--text-1);text-align:right}
  .dl{display:none}
  .qf .inp.area textarea{min-height:28px;height:28px}
  .top{padding-left:max(var(--gutter),calc((100vw - 1080px)/2 + var(--gutter)));padding-right:max(var(--gutter),calc((100vw - 1080px)/2 + var(--gutter)))}
  .rail{max-width:1080px;margin:0 auto}
  .page{padding-bottom:48px}
}
/* v83 題型：單選、多選、評分；預覽標示 */
.qf .desc{font-size:13px;color:var(--text-3);margin:-2px 0 8px;line-height:1.6}
.qf .badge.sel{color:var(--text-3)}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 14px;border-radius:var(--r-md);background:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2);font-size:15px;color:var(--text-1);cursor:pointer;text-align:left;font:inherit;border:0;width:100%}
.opt i{flex:none;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--text-3);display:grid;place-items:center}
.opt.sq i{border-radius:5px}
.opt.on{box-shadow:inset 0 0 0 1.5px var(--rose-500);background:rgba(255,46,139,.08)}
.opt.on i{background:var(--rose-500);box-shadow:none}
.opt.on i::after{content:'';width:7px;height:7px;border-radius:50%;background:#fff}
.opt.sq.on i::after{width:9px;height:5px;border-radius:0;background:none;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt[disabled]{cursor:default;opacity:.85}
.rate{display:flex;gap:10px;flex-wrap:wrap}
.rate button{width:46px;height:46px;border-radius:50%;border:0;background:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--text-1);font-family:var(--font-mono);font-size:16px;cursor:pointer}
.rate button.on{background:var(--rose-500);box-shadow:none;color:#fff}
.rate .lo{width:100%;display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);max-width:270px}
.pvbar{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;padding:8px 16px;background:#2A1F3D;color:#E4D8FF;font-size:13px;font-weight:600;letter-spacing:.04em;box-shadow:0 1px 0 rgba(201,182,250,.45)}
.pvbar .tag{padding:1px 10px;border-radius:99px;background:#C9B6FA;color:#2A1F3D}
.pvbar small{font-weight:400;opacity:.85}
.pvbar[hidden]{display:none}  /* 前台 [hidden]{display:none} 與 .pvbar 同權重、較早出現 → 一般學姐頁也會顯示預覽列 */
/* 填寫說明、段落說明、段落範例、題目說明：校長有填才顯示；保留換行 */
.ml{white-space:pre-line;overflow-wrap:anywhere}
.sec-d{font-size:14px;color:var(--text-2);line-height:1.75;margin:6px 0 12px;max-width:var(--measure)}
.sec-ex{margin:0 0 12px;padding:10px 14px;border-radius:var(--r-md);background:var(--ink-2);box-shadow:inset 2px 0 0 var(--gold),var(--shadow-ring)}
.sec-ex b{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--gold);margin-bottom:4px}
.sec-ex div{font-size:14px;color:var(--text-2);line-height:1.75}
</style>
</head>
<body>
<div class="pvbar" id="pvbar" hidden><span class="tag">預覽</span><span>學姐收到的畫面</span><small>唯讀・不儲存、不計入繳交</small></div>
<header class="top">
  <img src="../assets/logo-light.png" alt="G.R.A.C.E Academy" width="52" height="28">
  <div class="t"><b class="tt" id="tt">私享專場入群前作業</b><small id="topSave"><span class="wait">讀取中</span></small></div>
  <div class="ring" role="progressbar" aria-label="完成度" aria-valuemin="0" aria-valuemax="100" id="ring"><svg viewBox="0 0 44 44" aria-hidden="true" id="ringSvg"></svg><span id="ringTx">0%</span></div>
</header>
<nav class="rail" aria-label="分類" id="rail"></nav>

<div class="wrap">
<main class="page" id="main">
  <div class="tk">
    <div class="tk-stub"><span>PRIVATE</span><i></i><span class="d">Q&amp;A</span></div>
    <div class="tk-main">
      <div class="tk-top"><img src="../assets/logo-light.png" alt="" style="height:40px"><small id="tkEn">PRIVATE SESSION</small></div>
      <div class="eyebrow" style="margin-top:12px" id="eyebrow">入群前作業</div>
      <h1 id="h1"><span class="sk"></span></h1>
      <dl>
        <div><dt>學姐</dt><dd class="who" id="who"><span class="sk"></span></dd></div>
        <div><dt>截止</dt><dd class="mono" id="dlv">—</dd></div>
        <div><dt>入群</dt><dd class="mono" id="joinv">—</dd></div>
        <div><dt>開群</dt><dd class="mono" id="openv">—</dd></div>
      </dl>
    </div>
  </div>

  <div id="sentBox"></div>
  <div id="body"><div class="boot" id="boot">讀取中</div></div>
</main>

<aside class="side" id="side" hidden>
  <div class="card">
    <div class="en">PROGRESS</div>
    <h3>填寫進度</h3>
    <div class="pg" id="sidePg"></div>
    <dl class="kv2">
      <div><dt>截止</dt><dd class="mono" id="sideDl">—</dd></div>
      <div><dt>入群</dt><dd class="mono" id="sideJoin">—</dd></div>
      <div><dt>剩餘</dt><dd class="mono" id="sideLeft">—</dd></div>
      <div><dt>狀態</dt><dd id="sideSt">—</dd></div>
    </dl>
  </div>
</aside>
</div>

<div class="dl" role="region" aria-label="截止時間提示" id="dlbar" hidden><div class="dl-in"><span class="dl-dot"></span><div class="dl-main"><p class="dl-tx" id="dlTx"></p><span class="dl-cd" id="dlCd"></span></div></div></div>

<script>
(function () {
  'use strict';
  /* v83：題目依作業定義（form）產生；沒有 form（舊資料中心）＝內建 3 段 × 3 題簡答 30 字
   *  預覽：預覽代碼（資料中心回 preview）或嵌入後台（&embed=1，由同網域的後台以 postMessage 傳入作業定義）→ 唯讀、不儲存、不留本機副本 */
  var C = window.CONSULT_CONFIG || {}, q = /[?&]t=([A-Za-z0-9]{24,40})(?:&|#|$)/.exec(location.search), t = q ? q[1] : '';
  var EMBED = /[?&]embed=1(?:&|#|$)/.test(location.search);
  /* 後台「開啟她的作業頁／以…的連結開啟」（&preview=1）：唯讀預覽；資料中心不記錄開啟、不儲存；不讀寫本機副本 */
  var PV = /[?&]preview=1(?:&|#|$)/.test(location.search);
  var DEF_CATS = [['biz', '事業經營', 'BUSINESS'], ['grow', '個人成長', 'GROWTH'], ['mkt', '行銷佈局', 'MARKETING']], MAX = 30;
  var KEY = 'psqa:' + t, D = null, F = null, Q = [], A = [], dirty = false, busy = false, saveT = 0, lastErr = '';

  function fmtM(v) { var m = /^(\d{4})-(\d{2})$/.exec(String(v || '')); return m ? m[1] + '.' + m[2] : fmt(v); }

  function clean(s) { return String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f\u2028\u2029]/g, ' ').replace(/\s+/g, ' ').trim(); }
  function defForm() { return { v: 1, title: '', intro: '', sections: DEF_CATS.map(function (c) { return { id: c[0], t: c[1], en: c[2], qs: [1, 2, 3].map(function (n) { return { id: c[0] + '-' + n, t: '提問 ' + n, type: 'short', max: MAX, req: true }; }) }; }) }; }
  function flat(f) { var o = []; (f.sections || []).forEach(function (s, si) { (s.qs || []).forEach(function (x, qi) { o.push({ q: x, si: si, qi: qi, k: o.length }); }); }); return o; }
  function isText(x) { return x.type === 'short' || x.type === 'para' || !x.type; }
  function has(v) { return Array.isArray(v) ? v.length > 0 : clean(v) !== ''; }
  function filled() { return A.filter(has).length; }
  function reqLeft() { return Q.filter(function (e) { return e.q.req !== false && !has(A[e.k]); }); }
  function preview() { return PV || !!(D && (D.preview || D.readonly)); }
  function locked() { return !!(D && (preview() || D.locked || parse(D.series.dueAt) + 60000 <= Date.now())); }
  function sent() { return !!(D && D.submittedAt); }

  function call(action, payload, cb, onErr) {

    x.onerror = x.ontimeout = function () { onErr('網路連線中斷，內容已保留在這台裝置，恢復連線後再按一次'); };
    var b = { action: action, t: t }; if (PV) b.preview = 1; for (var k in payload) b[k] = payload[k]; x.send(JSON.stringify(b));
  }
  /** 作答陣列對齊定義（長度、題型） */
  function fit(a) { return Q.map(function (e) { var v = (a || [])[e.k]; if (e.q.type === 'multi') return Array.isArray(v) ? v.slice() : []; return Array.isArray(v) ? '' : (v == null ? '' : String(v)); }); }
  function setData(d) { D = d; F = d.form && Array.isArray(d.form.sections) && d.form.sections.length ? d.form : defForm(); Q = flat(F); }

  /* ── 畫面 ── */
  function head() {
    var s = D.series, full = s.full || '《私享專場》', title = (F.title || s.title || '').trim() || (full + '入群前作業');

    $('tt').textContent = title;
    $('h1').innerHTML = F.title || s.title ? esc(title) : '<span class="nw">' + esc(full) + '</span><br><span class="nw">入群前作業</span>';
    $('eyebrow').textContent = (s.tag ? s.tag + '・' : '') + '入群前作業';
    $('tkEn').textContent = 'PRIVATE SESSION';
    $('who').textContent = D.name || '—';
    $('dlv').textContent = fmt(s.dueAt, true); $('joinv').textContent = fmt(s.joinAt); $('openv').textContent = fmtM(s.openAt);
    $('sideDl').textContent = fmt(s.dueAt, true); $('sideJoin').textContent = fmt(s.joinAt);
    $('pvbar').hidden = !preview();
    if (PV && D && D.name && !/預覽/.test(D.name)) { $('pvbar').innerHTML = '<span class="tag">預覽</span><span>' + esc(D.name) + ' 的作業頁</span><small>唯讀・不儲存、不記錄開啟</small>'; }
  }
  function badge(x, v) { return x.req === false ? '<span class="badge sel">選填</span>' : '<span class="badge ' + (has(v) ? 'ok">已填' : 'req">必填') + '</span>'; }
  function fieldHtml(e) {
    var x = e.q, k = e.k, v = A[k], ro = locked();
    var lab = '<label class="l"' + (isText(x) ? ' for="q' + k + '"' : '') + '><span class="q">Q' + (e.qi + 1) + '</span>' + esc(x.t) + badge(x, v) + '</label>' + (ml(x.d) ? '<div class="desc ml" id="d' + k + '">' + esc(ml(x.d)) + '</div>' : '');
    if (isText(x)) {
      var mx = x.max || MAX, n = chars(v).length, full = n >= mx;
      return '<div class="qf' + (full ? ' full' : '') + (has(v) ? '' : ' miss') + '" data-k="' + k + '">' + lab +
        '<div class="inp area"><textarea id="q' + k + '" data-k="' + k + '" rows="' + (x.type === 'para' ? 4 : 2) + '"' + (x.type === 'para' ? ' data-para="1"' : ' enterkeyhint="done"') + ' autocomplete="off"' + (ro ? ' readonly' : '') + ' aria-describedby="' + (ml(x.d) ? 'd' + k + ' ' : '') + 'm' + k + '"' + (x.type === 'para' ? ' style="height:auto;min-height:96px"' : '') + '>' + esc(v) + '</textarea></div>' +
        '<div class="meta" id="m' + k + '">' + (full ? '<span class="lim">已達上限</span>' : '') + '<span><b>' + n + '</b>／' + mx + '</span></div></div>';
    }
    var body = '';
    if (x.type === 'rate') body = '<div class="rate" role="radiogroup" aria-label="' + esc(x.t) + '">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-k="' + k + '" data-v="' + n + '" role="radio" aria-checked="' + (String(v) === String(n)) + '" class="' + (String(v) === String(n) ? 'on' : '') + '"' + (ro ? ' disabled' : '') + '>' + n + '</button>'; }).join('') + '<div class="lo"><span>1 低</span><span>5 高</span></div></div>';
    else { var multi = x.type === 'multi'; body = '<div class="opts" role="' + (multi ? 'group' : 'radiogroup') + '" aria-label="' + esc(x.t) + '">' + (x.opts || []).map(function (o) { var on = multi ? (Array.isArray(v) && v.indexOf(o) >= 0) : v === o; return '<button type="button" class="opt' + (multi ? ' sq' : '') + (on ? ' on' : '') + '" data-k="' + k + '" data-v="' + esc(o) + '" role="' + (multi ? 'checkbox' : 'radio') + '" aria-checked="' + on + '"' + (ro ? ' disabled' : '') + '><i></i><span>' + esc(o) + '</span></button>'; }).join('') + '</div>'; }
    return '<div class="qf' + (has(v) ? '' : ' miss') + '" data-k="' + k + '">' + lab + body + '</div>';
  }
  /** 段落說明、範例（有內容才顯示） */
  function secInfo(s) { var d = ml(s.desc), x = ml(s.ex); return (d ? '<div class="sec-d ml">' + esc(d) + '</div>' : '') + (x ? '<div class="sec-ex"><b>範例</b><div class="ml">' + esc(x) + '</div></div>' : ''); }
  function body() {
    var maxs = Q.filter(function (e) { return isText(e.q); }).map(function (e) { return e.q.max || MAX; }), same = maxs.length && maxs.every(function (m) { return m === maxs[0]; });
    var intro = ml(F.intro || D.series.intro || '');
    var h = '<div class="rules">' + (intro ? '<div class="r"><b>說明</b><span class="ml">' + esc(intro) + '</span></div>' : '<div class="r"><b>字數</b><span>' + (same ? '問題與背景合併一欄，每題上限 <span class="mono">' + maxs[0] + '</span> 字' : '每題字數上限標示在欄位下方') + '</span></div>') + '<div class="r"><b>修改</b><span>送出後於截止前皆可修改，以最後一次送出為準</span></div></div>';
    (F.sections || []).forEach(function (s, si) {
      h += '<section class="sec" id="sec' + si + '"><div class="sec-h"><h2>' + esc(s.t) + '</h2>' + (s.en ? '<span class="en">' + esc(s.en) + '</span>' : '') + '</div>' + secInfo(s) + '<div class="card qcard">';
      Q.forEach(function (e) { if (e.si === si) h += fieldHtml(e); });
      h += '</div></section>';
    });
    h += '<div class="sendbar"><div class="save-st" id="saveSt" role="status" aria-live="polite"></div><div class="btnrow" id="btns"></div><div class="send-hint" id="sendHint"></div></div>';
    $('body').innerHTML = h;
  }
  function one(k) {
    var el = document.querySelector('.qf[data-k="' + k + '"]'); if (!el) return;
    var e = Q[k], x = e.q, v = A[k], ok = has(v);
    el.classList.toggle('miss', !ok); if (ok) el.classList.remove('need');
    var b = el.querySelector('.badge'); if (b && x.req !== false) { b.className = 'badge ' + (ok ? 'ok' : 'req'); b.textContent = ok ? '已填' : '必填'; }
    if (isText(x)) { var mx = x.max || MAX, n = chars(v).length, full = n >= mx; el.classList.toggle('full', full); el.querySelector('.meta').innerHTML = (full ? '<span class="lim">已達上限</span>' : '') + '<span><b>' + n + '</b>／' + mx + '</span>'; }
    else el.querySelectorAll('[data-v]').forEach(function (bt) { var on = x.type === 'multi' ? (Array.isArray(v) && v.indexOf(bt.dataset.v) >= 0) : String(v) === bt.dataset.v; bt.classList.toggle('on', on); bt.setAttribute('aria-checked', String(on)); });

  function progress() {
    var f = filled(), tot = Q.length, need = Q.filter(function (e) { return e.q.req !== false; }), done = need.filter(function (e) { return has(A[e.k]); }).length;
    var pct = need.length ? Math.round(done / need.length * 100) : Math.round(f / Math.max(1, tot) * 100), r = 19, c = 2 * Math.PI * r;
    $('ringTx').textContent = pct + '%'; $('ring').setAttribute('aria-valuenow', pct);
    $('ringSvg').innerHTML = '<circle cx="22" cy="22" r="' + r + '" stroke="var(--ink-3)" stroke-width="4" fill="none"/><circle cx="22" cy="22" r="' + r + '" stroke="' + (pct === 100 ? 'var(--success-500)' : 'var(--rose-500)') + '" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="' + (c * pct / 100).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 22 22)"/>';
    var per = (F.sections || []).map(function (s, si) { var L = Q.filter(function (e) { return e.si === si; }), n = L.filter(function (e) { return has(A[e.k]); }).length; return [n, L.length]; });
    $('rail').innerHTML = (F.sections || []).map(function (s, si) { var n = per[si][0], m = per[si][1]; return '<a class="rs" href="#sec' + si + '" title="' + esc(s.t) + '"><i class="' + (m && n === m ? 'on' : n ? 'cur' : '') + '"></i></a>'; }).join('');
    $('sidePg').innerHTML = (F.sections || []).map(function (s, si) { var n = per[si][0], m = per[si][1]; return '<div><div class="row1"><span>' + esc(s.t) + '</span><span>' + (m && n === m ? '<span class="badge ok">已完成</span>' : n ? '<span class="badge warn">填寫中</span>' : '<span class="badge">未開始</span>') + '</span></div><div class="prog' + (m && n === m ? ' ok' : '') + '"><i style="width:' + (m ? n / m * 100 : 0) + '%"></i></div></div>'; }).join('');
    return pct;
  }
  function stateUi() {
    progress(); var pv = preview(), lk = locked(), s = sent(), ch = s && D.changed, left = Math.max(0, Math.ceil((parse(D.series.dueAt) + 60000 - Date.now()) / 864e5));

    var st = $('saveSt'); if (!st) return;

  }
  function draw() { head(); body(); stateUi(); $('side').hidden = false; }

  /* ── 輸入：簡答換行改空白、超過上限截掉（注音輸入組字中不截）；段落保留換行 ── */
  function onInput(ta) {

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button'); if (!b) return;

      if (x.type === 'multi') { var cur = Array.isArray(A[k]) ? A[k].slice() : [], i = cur.indexOf(val); if (i >= 0) cur.splice(i, 1); else cur.push(val); A[k] = (x.opts || []).filter(function (o) { return cur.indexOf(o) >= 0; }); }
      else A[k] = A[k] === val ? '' : val;
      changed(k); return;
    }
    if (b.id === 'bSave') save(false, false);
    if (b.id === 'bSend') {
      var miss = reqLeft(); if (miss.length) { var el = document.querySelector('.qf[data-k="' + miss[0].k + '"]'); el.classList.add('need'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      save(true, false);
    }
  });

  /* ── 儲存／送出 ── */
  function save(submit, auto) {
    if (!D || locked()) return;
    if (busy) { if (!auto) { clearTimeout(saveT); saveT = setTimeout(function () { save(submit, false); }, 300); } return; }
    if (auto && !dirty) return;
    clearTimeout(saveT); busy = true; lastErr = ''; stateUi();
    var sentA = JSON.parse(JSON.stringify(A)), same = function () { return JSON.stringify(A) === JSON.stringify(sentA); };
    call('lms_ps_q_save', { answers: sentA, submit: !!submit, fv: D.fv || (F && F.v) || 1 }, function (r) {
      busy = false; D.savedAt = r.savedAt; D.submittedAt = r.submittedAt || D.submittedAt; D.status = r.status;
      var eq = same(); dirty = !eq; D.changed = r.changed || !eq; D.answers = r.answers;
      if (eq) { A = fit(r.answers); for (var k = 0; k < Q.length; k++) { var ta = $('q' + k); if (ta && ta.value !== A[k] && document.activeElement !== ta) { ta.value = A[k]; } one(k); } }
      store(); stateUi();

    }, function (m, code) {
      busy = false; lastErr = m;
      if (code === 'ERR_LOCKED') { D.locked = true; dirty = false; store(); draw(); return; }
      if (code === 'ERR_STALE') { load(); return; }
      store(); stateUi();
    });
  }
  window.addEventListener('pagehide', function () { if (!PV && dirty && D && !locked() && navigator.sendBeacon && C.GAS_URL) { try { navigator.sendBeacon(C.GAS_URL, new Blob([JSON.stringify({ action: 'lms_ps_q_save', t: t, answers: A, fv: D.fv || (F && F.v) || 1 })], { type: 'text/plain;charset=utf-8' })); } catch (e) { /* ignore */ } } });

  /* ── 開啟：先畫本機副本（立即），再向資料中心取最新 ── */
  function fail(m) { $('body').innerHTML = '<p class="fail">' + esc(m) + '</p>'; $('topSave').innerHTML = '<span class="warn">無法開啟</span>'; $('h1').textContent = '入群前作業'; $('who').textContent = '—'; }
  function load() {
    call('lms_ps_q_get', {}, function (d) {
      var keepLocal = D && dirty && !d.locked && !d.preview && D.fv === d.fv;
      var mine = keepLocal ? A : null; setData(d); A = fit(mine || d.answers); if (!keepLocal) dirty = false;
      var ae = document.activeElement, focusK = ae && ae.dataset ? ae.dataset.k : null, pos = focusK != null && ae.selectionStart != null ? ae.selectionStart : 0;

    }, function (m) { if (D) { lastErr = m; stateUi(); } else fail(m); });
  }
  /* 嵌入後台預覽：同網域的後台傳入 { psqa:'preview', d }（含作業定義、系列、預覽姓名） */

    if (ev.origin !== location.origin || !ev.data || ev.data.psqa !== 'preview' || !ev.data.d) return;

  });
  if (EMBED) { try { window.parent.postMessage({ psqa: 'ready' }, location.origin); } catch (e) { /* ignore */ } if (!t || !C.GAS_URL) return; }
  if (!t) { fail('連結不完整，請回到 LINE 重新開啟入群前作業'); return; }
  var cached = null; try { cached = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { cached = null; }
  if (!EMBED && !PV && cached && cached.d && cached.d.series) { setData(cached.d); A = fit(cached.a || D.answers); dirty = !!cached.dirty; draw(); }
  if (!C.GAS_URL) { if (!D) fail('預覽模式：正式網站會讀取學姐的作業'); return; }
  load();
})();
